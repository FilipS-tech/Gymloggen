}

function sessCard(s, withDelete) {
  const c = state.confirm === "del-" + s.id;
  return `<div class="card sess">
    <div class="sess-head"><div><div class="sess-date">${dLong(s.date)}</div><div class="muted small">${esc(s.programName)}${s.example ? ` <span class="chip">Exempel</span>` : ""}</div></div>
    ${withDelete && !c ? `<button class="btn sm danger" data-act="delSess" data-id="${s.id}">Ta bort</button>` : ""}</div>
    <ul>${(s.entries || []).map(e => `<li><span>${esc(e.name)}</span><span>${esc(fmtEntry(e))}</span></li>`).join("")}</ul>
    ${c ? `<div class="btnrow"><button class="btn danger" data-act="delSessYes" data-id="${s.id}">Ja, ta bort passet</button><button class="btn" data-act="confirmNo">Behåll</button></div>` : ""}
  </div>`;
}

const dayKey = d => d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
function yearGrid() {
  const now = new Date(), y = state.year || now.getFullYear();
  const logged = new Set(state.sessions.map(s => dayKey(new Date(s.date))));
  const n = Math.round((new Date(y + 1, 0, 1) - new Date(y, 0, 1)) / 864e5);
  let cells = "", count = 0;
  for (let i = 0; i < n; i++) {
    const d = new Date(y, 0, 1 + i), k = dayKey(d), on = logged.has(k);
    if (on) count++;
    cells += `<i class="${on ? "on" : ""}${k === dayKey(now) ? " today" : ""}" title="${d.toLocaleDateString("sv-SE", { day: "numeric", month: "long" })}${on ? " · pass loggat" : ""}"></i>`;
  }
  return `<div class="card section">
    <div class="yhead"><button class="iconbtn" data-act="year" data-v="-1" aria-label="Föregående år">${S('<path d="M15 5l-7 7 7 7"/>')}</button>
      <div style="text-align:center"><div class="y">${y}</div><div class="muted small">${count} ${count === 1 ? "dag" : "dagar"} med pass</div></div>
      <button class="iconbtn" data-act="year" data-v="1" aria-label="Nästa år">${S('<path d="M9 5l7 7-7 7"/>')}</button></div>
    <div class="yg" role="img" aria-label="${count} dagar med pass under ${y}">${cells}</div>
    <div class="legend"><span><i></i>Inget pass</span><span><i class="on"></i>Pass loggat</span><span>1 jan uppe till vänster</span></div>
  </div>`;
}
function vHistory() {
  if (!state.sessions.length) return yearGrid() + `<div class="card empty"><p><b>Inga pass sparade än.</b></p><p class="muted">När du sparar ett pass hamnar det här.</p></div>`;
  const ex = state.sessions.filter(s => s.example).length;
  return `${yearGrid()}${ex ? `<div class="banner"><span>${ex} exempelpass visas så du ser hur det ser ut.</span>
    ${state.confirm === "clearEx" ? `<span class="btnrow"><button class="btn sm danger" data-act="clearExYes">Ja, ta bort</button><button class="btn sm" data-act="confirmNo">Nej</button></span>`
      : `<button class="btn sm" data-act="clearEx">Ta bort exempel</button>`}</div>` : ""}
    <section class="section"><h2>${state.sessions.length} pass</h2>${state.sessions.map(s => sessCard(s, true)).join("")}</section>`;
}

function passIndex() {
  const map = new Map();
  for (const s of state.sessions) { const k = s.programId || s.programName; if (!map.has(k)) map.set(k, { key: k, name: s.programName }); }
  for (const p of state.programs) if (map.has(p.id)) map.get(p.id).name = p.name;
  return [...map.values()];
}
function exerciseIndex(passKey) {
  const map = new Map();
  const ss = state.sessions.filter(s => (s.programId || s.programName) === passKey);
  for (const s of ss.slice().reverse()) for (const e of (s.entries || [])) {
    if (e.locked) continue;
    const key = e.name.trim().toLowerCase();
    if (!map.has(key)) map.set(key, { key, name: e.name, type: e.type, icon: e.icon, points: [] });
    const m = map.get(key); m.name = e.name; m.type = e.type;
    m.points.push({ date: s.date, y: metric(e), e });
  }
  return [...map.values()];
}

function vProgress() {
  const passes = passIndex();
  if (!passes.length) return `<div class="card empty"><p><b>Ingen progression än.</b></p><p class="muted">Spara ett par pass så ritas en graf per övning här.</p></div>`;
  if (!state.progPass || !passes.some(p => p.key === state.progPass)) state.progPass = passes[0].key;
  const passSel = `<div class="field"><label for="prog-pass">Pass</label><select id="prog-pass" data-act-change="progPass">
      ${passes.map(p => `<option value="${esc(p.key)}"${p.key === state.progPass ? " selected" : ""}>${esc(p.name)}</option>`).join("")}</select></div>`;
  const list = exerciseIndex(state.progPass);
  if (!list.length) return `<section class="section">${passSel}<div class="card empty"><p class="muted">Det här passet har bara låsta övningar, så det finns ingen progression att visa.</p></div></section>`;
  if (!state.progKey || !list.some(x => x.key === state.progKey)) state.progKey = (list.find(x => x.type === "kg") || list[0]).key;
  const cur = list.find(x => x.key === state.progKey);
  const u = metricUnit(cur.type);
  const ys = cur.points.map(p => p.y);
  const first = ys[0], lastV = ys[ys.length - 1], best = Math.max(...ys);
  const diff = lastV - first;
  return `<section class="section">
    ${passSel}
    <div class="field"><label for="prog-ex">Övning</label><select id="prog-ex" data-act-change="progEx">
      ${list.map(x => `<option value="${esc(x.key)}"${x.key === cur.key ? " selected" : ""}>${esc(x.name)}</option>`).join("")}</select></div>
    <div class="stats">
      <div class="stat"><div class="k">Senast</div><div class="v">${fmtNum(lastV)} <span class="small muted">${u}</span></div></div>
      <div class="stat"><div class="k">Bästa</div><div class="v">${fmtNum(best)} <span class="small muted">${u}</span></div></div>
      <div class="stat"><div class="k">Ökning</div><div class="v">${diff > 0 ? "+" : ""}${fmtNum(diff)} <span class="small muted">${u}</span></div></div>
    </div>
    <div class="card">${chart(cur.points, u)}</div>
    <h2>Alla pass · ${esc(cur.name)}</h2>
    <div class="card sess"><ul>${cur.points.slice().reverse().map(p => `<li><span>${dShort(p.date)}</span><span>${esc(fmtEntry(p.e))}</span></li>`).join("")}</ul></div>
  </section>`;
}

function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function chart(points, unit) {
  const W = 640, H = 260, L = 46, R = 22, T = 26, B = 34;
  const ys = points.map(p => p.y);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (lo === hi) { lo -= Math.max(1, lo * 0.1); hi += Math.max(1, hi * 0.1); }
  const step = niceStep((hi - lo) / 4);
  lo = Math.max(0, Math.floor(lo / step) * step); hi = Math.ceil(hi / step) * step;
  const x = i => points.length === 1 ? L + (W - L - R) / 2 : L + i * (W - L - R) / (points.length - 1);
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  let g = "";
  for (let v = lo; v <= hi + step / 2; v += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${fmtNum(v)}</text>`;
  const n = points.length, every = Math.max(1, Math.ceil(n / 6));
  let xl = "";
  points.forEach((p, i) => { if (i % every === 0 || i === n - 1) { if (i !== n - 1 && n - 1 - i < every) return; xl += `<text x="${x(i)}" y="${H - 10}" text-anchor="${n === 1 ? "middle" : i === 0 ? "start" : i === n - 1 ? "end" : "middle"}">${dShort(p.date)}</text>`; } });
  const pts = points.map((p, i) => `${x(i)},${y(p.y)}`).join(" ");
  const area = n > 1 ? `<polygon class="ar" points="${x(0)},${y(lo)} ${pts} ${x(n - 1)},${y(lo)}"/>` : "";
  const dots = points.map((p, i) => i === n - 1 ? "" : `<circle class="dt" cx="${x(i)}" cy="${y(p.y)}" r="4"/>`).join("");
  const ex = x(n - 1), ey = y(points[n - 1].y);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Graf över ${unit} per pass">
    ${g}${xl}${area}${n > 1 ? `<polyline class="ln" points="${pts}"/>` : ""}${dots}
    <circle class="end" cx="${ex}" cy="${ey}" r="6"/>
    <text class="endlbl" x="${ex}" y="${ey < T + 18 ? ey + 22 : ey - 12}" text-anchor="${n === 1 ? "middle" : "end"}">${fmtNum(points[n - 1].y)} ${unit}</text></svg>`;
}

/* ---------- render ---------- */
let pending = false;
function render(force) {
  const a = document.activeElement;
  if (!force && a && main.contains(a) && /INPUT|SELECT|TEXTAREA/.test(a.tagName)) { pending = true; return; }
  pending = false;
  if (state.screen !== "app") {
    $("#title").textContent = "Gymloggen"; $("#burger").hidden = true; $("#menu").hidden = true; state.menu = false;
    renderModal(); main.innerHTML = vScreen(); return;
  }
  $("#burger").hidden = false;
  const titles = { trana: state.active && !state.active.paused ? "Pass pågår" : "Träna", program: "Program", historik: "Historik", progression: "Progression" };
  $("#title").textContent = titles[state.view];
  $("#tabs").innerHTML = TABS.map(([k, v]) => `<button data-tab="${k}"${state.view === k ? ' aria-current="page"' : ""}>${TAB_ICONS[k]}<span>${v}</span></button>`).join("");
  $("#tabs").innerHTML += `<button data-act="openCoach">${S('<path d="M12 3l1.9 4.6L18.5 9l-4.6 1.9L12 15.5l-1.9-4.6L5.5 9l4.6-1.4z"/><path d="M18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z"/>')}<span>Fråga coachen</span></button>`;
  $("#account").innerHTML = state.user ? `<span class="muted small">${esc(state.user.email || "")}</span><button class="btn sm" data-act="logout">Logga ut</button>` : "";
  $("#menu").hidden = !state.menu; $("#burger").setAttribute("aria-expanded", String(!!state.menu));
  renderModal();
  main.innerHTML = state.view === "trana" ? vTrain() : state.view === "program" ? vPrograms() : state.view === "historik" ? vHistory() : vProgress();
}
main.addEventListener("focusout", () => { if (pending) setTimeout(() => { const a = document.activeElement; if (!(a && main.contains(a) && /INPUT|SELECT|TEXTAREA/.test(a.tagName))) render(true); }, 0); });

const dirty = () => !!state.editing && JSON.stringify(state.editing) !== state.editOrig;
function renderModal() {
  const m = $("#modal"), md = state.modal;
  if (!md) { m.hidden = true; m.innerHTML = ""; return; }
  m.hidden = false;
  m.innerHTML = md.kind === "pass"
    ? `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">Avsluta passet?</h3>
        <p>Du har ett pass igång. Vill du spara det du fyllt i som utkast eller slänga det?</p>
        <button class="btn" data-act="mBack">Gå tillbaka</button>
        <button class="btn primary" data-act="mDraft">Spara som utkast</button>
        <button class="btn danger" data-act="mDrop">Släng passet</button></div>`
    : `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">Osparade ändringar</h3>
        <p>Du har ändrat i programmet utan att spara.</p>
        <button class="btn" data-act="mBack">Gå tillbaka</button>
        <button class="btn primary" data-act="mSaveProg">Spara programmet</button>
        <button class="btn danger" data-act="mDropEdit">Släng ändringarna</button></div>`;
  const first = m.querySelector("button"); first && first.focus();
}
function leave(next) {
  if (state.view === "program" && dirty()) { state.modal = { kind: "edit", next }; render(true); return; }
  if (state.view === "program") state.editing = null;
  go(next);
}
function saveProgram() {
  const E = state.editing;
  E.name = E.name.trim(); E.exercises = E.exercises.filter(x => x.name.trim());
  if (!E.name) { toast("Ge programmet ett namn först."); return false; }
  if (!E.exercises.length) { toast("Lägg till minst en övning med namn."); return false; }
  E.exercises.forEach(x => { if (x.tipsText != null) { x.tips = x.tipsText.split("\n").map(t => t.trim()).filter(Boolean).slice(0, 4); delete x.tipsText; } x.name = x.name.trim(); x.locked = !!x.locked; x.value = x.type === "bw" ? null : num(x.value); x.reps = x.type === "time" ? 1 : (num(x.reps) || 1); x.sets = num(x.sets) || 1; });
  const list = state.programs.slice(); const at = list.findIndex(p => p.id === E.id);
  at >= 0 ? list[at] = E : list.push(E);
  Store.savePrograms(list); state.editing = null; toast("Programmet sparat"); return true;
}
function go(view) { state.view = view; state.confirm = null; try { history.replaceState(null, "", "#" + view); } catch (_) { location.hash = view; } render(true); window.scrollTo(0, 0); }
function fromHash() { const h = location.hash.slice(1); if (TABS.some(t => t[0] === h)) state.view = h; }
window.addEventListener("hashchange", () => { fromHash(); render(true); });

/* ---------- actions ---------- */
const newEx = () => ({ id: uid(), name: "", type: "kg", icon: "gen", locked: false });
document.addEventListener("click", ev => {
  if (state.menu && !ev.target.closest("#menu") && !ev.target.closest("#burger")) { state.menu = false; $("#menu").hidden = true; $("#burger").setAttribute("aria-expanded", "false"); return; }
  const tab = ev.target.closest("[data-tab]"); if (tab) { state.menu = false; if (tab.dataset.tab === state.view) return render(true); }
  if (tab) return tab.dataset.tab === state.view ? null : leave(tab.dataset.tab);
  if (ev.target === $("#modal")) { state.modal = null; return render(true); }
  const b = ev.target.closest("[data-act]"); if (!b || b.disabled) return;
  const act = b.dataset.act, id = b.dataset.id, i = +b.dataset.i;
  const E = state.editing;
  switch (act) {
    case "newProgram": state.editing = { id: uid(), name: "", exercises: [newEx()] }; state.open = new Set([state.editing.exercises[0].id]); state.editOrig = JSON.stringify(state.editing); state.view = "program"; break;
    case "edit": state.editing = clone(state.programs.find(p => p.id === id)); state.editOrig = JSON.stringify(state.editing); state.open = new Set(); break;
    case "closeEdit": state.editing = null; break;
    case "addEx": { const nx = newEx(); E.exercises.forEach(x => { if (x.name.trim()) state.open.delete(x.id); }); E.exercises.push(nx); state.open.add(nx.id); render(true); const el = document.getElementById(`e-${E.exercises.length - 1}-name`); el && el.focus(); return; }
    case "openEx": state.open.add(E.exercises[i].id); break;
    case "closeEx": if (!E.exercises[i].name.trim()) { toast("Ge övningen ett namn först."); return; } state.open.delete(E.exercises[i].id); break;
    case "delEx": state.open.delete(E.exercises[i].id); E.exercises.splice(i, 1); break;
    case "up": [E.exercises[i - 1], E.exercises[i]] = [E.exercises[i], E.exercises[i - 1]]; break;
    case "down": [E.exercises[i + 1], E.exercises[i]] = [E.exercises[i], E.exercises[i + 1]]; break;
    case "lock": E.exercises[i].locked = !E.exercises[i].locked; break;
    case "day": { const d = +b.dataset.v; const set = new Set(E.days || []); set.has(d) ? set.delete(d) : set.add(d); E.days = DAY_ORDER.filter(x => set.has(x)); break; }
    case "saveProgram": if (!saveProgram()) return; break;
    case "delProgram": state.confirm = "delProgram"; break;
    case "delProgramYes": Store.savePrograms(state.programs.filter(p => p.id !== E.id)); state.editing = null; state.confirm = null; toast("Programmet borttaget"); break;
    case "start": {
      const p = state.programs.find(q => q.id === id);
      state.active = { programId: p.id, programName: p.name, startedAt: new Date().toISOString(),
        entries: p.exercises.map(x => x.locked ? { exId: x.id, name: x.name, type: x.type, icon: x.icon, locked: true, value: x.value ?? null, reps: x.reps || 1, sets: x.sets || 1 }
          : { exId: x.id, name: x.name, type: x.type, icon: x.icon, locked: false, value: "", reps: "", sets: "",
              plan: { value: x.value ?? null, reps: x.reps > 1 ? x.reps : null, sets: x.sets > 1 ? x.sets : null } }) };
      state.tipsOpen = new Set(); saveDraft(); break;
    }
    case "finish": {
      const a = state.active; const entries = [];
      for (const e of a.entries) {
        if (e.locked) { entries.push({ exId: e.exId, name: e.name, type: e.type, icon: e.icon, locked: true, value: e.value, reps: e.reps, sets: e.sets }); continue; }
        const value = num(e.value), reps = num(e.reps), sets = num(e.sets);
        const filled = e.type === "bw" ? reps != null : value != null;
        if (!filled) continue;
        entries.push({ exId: e.exId, name: e.name, type: e.type, icon: e.icon, locked: false, value: e.type === "bw" ? null : value, reps: e.type === "time" ? 1 : (reps || 1), sets: sets || 1 });
      }
      if (!entries.length) { toast("Fyll i minst en övning innan du sparar."); return; }
      Store.addSession({ id: uid(), date: new Date().toISOString(), programId: a.programId, programName: a.programName, entries });
      state.active = null; saveDraft(); toast("Passet sparat"); break;
    }
    case "cancel": state.confirm = "cancel"; break;
    case "cancelYes": state.active = null; saveDraft(); state.confirm = null; break;
    case "delSess": state.confirm = "del-" + id; break;
    case "delSessYes": Store.deleteSession(id); state.confirm = null; toast("Passet borttaget"); break;
    case "clearEx": state.confirm = "clearEx"; break;
    case "clearExYes": state.sessions.filter(s => s.example).forEach(s => Store.deleteSession(s.id)); state.confirm = null; toast("Exempelpassen borttagna"); break;
    case "confirmNo": state.confirm = null; break;
    case "export": exportData(); return;
    case "importNo": state.pendingImport = null; break;
    case "importYes": { const d = state.pendingImport; state.pendingImport = null; Store.writeLocal(d); state.programs = d.programs; state.sessions = sortS(d.sessions); toast("Data importerad"); break; }
    case "menu": state.menu = !state.menu; break;
    case "tips": { state.tipsOpen = state.tipsOpen || new Set(); state.tipsOpen.has(i) ? state.tipsOpen.delete(i) : state.tipsOpen.add(i); break; }
    case "reload": location.reload(); return;
    case "authMode": state.authMode = b.dataset.v; state.authMsg = null; { const e = $("#au-email"); if (e) state.authEmail = e.value; } break;
    case "google": {
      state.busy = true; render(true);
      sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: redirectTo() } }).then(({ error }) => { if (error) { state.busy = false; state.authMsg = { err: true, text: authErr(error) }; render(true); } });
      return;
    }
    case "logout": state.menu = false; Auth.logout(); return;
    case "importLegacy": {
      const L = state.legacy; state.legacy = null;
      const keep = (L.sessions || []).filter(x => !x.example);
      Store.savePrograms(clone(L.programs || []));
      keep.forEach(x => Store.addSession(clone(x)));
      try { localStorage.setItem("gymloggen-v1-handled", "1"); } catch (_) {}
      Auth.markOnboarded(); state.screen = "app";
      toast("Datan är flyttad till ditt konto"); break;
    }
    case "skipLegacy": try { localStorage.setItem("gymloggen-v1-handled", "1"); } catch (_) {} state.legacy = null; state.screen = Store.get("onboarded", false) ? "app" : "onboard"; break;
    case "skipOnboard": Auth.markOnboarded(); state.screen = "app"; break;
    case "coachStart": state.coach = newCoach("onboard"); state.screen = "coach"; break;
    case "openCoach": {
      if (state.view === "program" && dirty()) { toast("Spara eller avbryt programmet först."); return; }
      state.menu = false; state.editing = null; state.coach = newCoach("app"); state.screen = "coach"; window.scrollTo(0, 0); break;
    }
    case "cset": { const k = b.dataset.k, v = b.dataset.v; state.coach.answers[k] = /^\d+$/.test(v) ? +v : v; break; }
    case "cday": { const d = +b.dataset.v, a = state.coach.answers; a.days = a.days.includes(d) ? a.days.filter(x => x !== d) : DAY_ORDER.filter(x => x === d || a.days.includes(x)); break; }
    case "coachRun": runCoach(false); return;
    case "coachRedo": runCoach(true); return;
    case "coachFeedback": state.coach.showFeedback = true; render(true); { const t = $("#c-feedback"); t && t.focus(); } return;
    case "coachSave": saveCoach(); return;
    case "coachCancel": { const from = state.coach && state.coach.from; state.coach = null; if (from === "onboard") Auth.markOnboarded(); state.screen = "app"; break; }
    case "title": {
      if (state.screen !== "app") return;
      state.confirm = null;
      if (state.view === "trana" && state.active && !state.active.paused) { state.modal = { kind: "pass" }; break; }
      if (state.view === "program" && state.editing) { if (dirty()) { state.modal = { kind: "edit", next: "program" }; break; } state.editing = null; }
      if (state.view === "historik") state.year = null;
      window.scrollTo(0, 0); break;
    }
    case "mBack": state.modal = null; break;
    case "mDraft": state.active.paused = true; saveDraft(); state.modal = null; toast("Sparat som utkast"); window.scrollTo(0, 0); break;
    case "mDrop": state.active = null; saveDraft(); state.modal = null; toast("Passet slängt"); window.scrollTo(0, 0); break;
    case "mSaveProg": { const next = state.modal.next; state.modal = null; if (!saveProgram()) break; go(next); return; }
    case "mDropEdit": { const next = state.modal.next; state.modal = null; state.editing = null; go(next); return; }
    case "resume": state.active.paused = false; saveDraft(); break;
    case "dropDraft": state.confirm = "dropDraft"; break;
    case "dropDraftYes": state.active = null; saveDraft(); state.confirm = null; break;
    case "year": state.year = (state.year || new Date().getFullYear()) + (+b.dataset.v); break;
  }
  render(true);
});

document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.dataset.c && state.coach) { if (t.dataset.c === "feedback") state.coach.feedback = t.value; else state.coach.answers[t.dataset.c] = t.value; return; }
  if (t.dataset.a != null) { state.active.entries[+t.dataset.a][t.dataset.f] = t.value; saveDraft(); }
  else if (t.dataset.e != null && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) state.editing.exercises[+t.dataset.e][t.dataset.f] = t.value;
  else if (t.dataset.p) state.editing[t.dataset.p] = t.value;
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.id === "imp" && t.files && t.files[0]) {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const d = JSON.parse(fr.result);
        if (!Array.isArray(d.programs) || !Array.isArray(d.sessions)) throw 0;
        state.pendingImport = { programs: d.programs, sessions: d.sessions }; render(true);
      } catch (_) { toast("Filen är inte en säkerhetskopia från Gymloggen."); }
    };
    fr.readAsText(t.files[0]); t.value = ""; return;
  }
  if (t.dataset.actChange === "progEx") { state.progKey = t.value; render(true); return; }
  if (t.dataset.actChange === "progPass") { state.progPass = t.value; state.progKey = null; render(true); return; }
  if (t.dataset.e != null && t.tagName === "SELECT") { state.editing.exercises[+t.dataset.e][t.dataset.f] = t.value; render(true); }
});

async function exportData() {
  const d = { programs: state.programs, sessions: state.sessions };
  const name = "gymloggen-" + new Date().toISOString().slice(0, 10) + ".json";
  const blob = new Blob([JSON.stringify(d, null, 2)], { type: "application/json" });
  try {
    const file = new File([blob], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Gymloggen säkerhetskopia" }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast("Säkerhetskopian sparad");
}
document.addEventListener("submit", async ev => {
  ev.preventDefault();
  const f = ev.target;
  if (f.id === "authform") {
    const email = ($("#au-email").value || "").trim(), passEl = $("#au-pass"), pass = passEl ? passEl.value : "";
    state.authEmail = email;
    if (!email) { state.authMsg = { err: true, text: "Fyll i din e-post." }; return render(true); }
    if (state.authMode !== "reset" && pass.length < 6) { state.authMsg = { err: true, text: "Lösenordet måste vara minst 6 tecken." }; return render(true); }
    state.busy = true; state.authMsg = null; render(true);
    try {
      if (state.authMode === "in") {
        const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
        if (error) throw error;
        state.busy = false; return Auth.enter(data.user);
      }
      if (state.authMode === "up") {
        const { data, error } = await sb.auth.signUp({ email, password: pass, options: { emailRedirectTo: redirectTo() } });
        if (error) throw error;
        state.busy = false;
        if (data.session) return Auth.enter(data.user);
        state.authMode = "in"; state.authMsg = { text: `Vi har skickat ett mejl till ${email}. Klicka på länken i mejlet för att bekräfta kontot, och logga sedan in här.` };
        return render(true);
      }
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: redirectTo() });
      if (error) throw error;
      state.busy = false; state.authMode = "in"; state.authMsg = { text: `Om det finns ett konto för ${email} har vi skickat en länk för att välja nytt lösenord.` };
      render(true);
    } catch (e) { state.busy = false; state.authMsg = { err: true, text: authErr(e) }; render(true); }
    return;
  }
  if (f.id === "recoverform") {
    const pass = $("#au-new").value || "";
    if (pass.length < 6) { state.authMsg = { err: true, text: "Lösenordet måste vara minst 6 tecken." }; return render(true); }
    state.busy = true; render(true);
    const { data, error } = await sb.auth.updateUser({ password: pass });
    state.busy = false;
    if (error) { state.authMsg = { err: true, text: authErr(error) }; return render(true); }
    toast("Lösenordet är bytt"); return Auth.enter(data.user);
  }
});
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && (state.modal || state.menu)) { state.modal = null; state.menu = false; render(true); } });
fromHash(); render(true); Auth.init();
})();
</script>
</body>
